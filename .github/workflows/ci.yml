name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # rado/verify_all.py IS the gate. On a runner with no kissat and no drat-trim
  # it announces the solver sections as SKIPPED and runs everything that does
  # not need them: the standalone checker's selftest, support enumeration
  # against a naive multiset enumeration, the convention pinned against
  # published values by pure exhaustion, every claimed term re-derived from its
  # own evidence files, and a check that the prose matches the evidence. That is
  # 428 checks in about three seconds.
  #
  # What CI deliberately does NOT do is the DRAT ladder. Proof files are
  # regenerated rather than stored (.drat is in .gitignore), so replaying them
  # needs kissat to produce them first, and the run takes far longer than a CI
  # job should. It is a local step: install both binaries and run
  # `python rado/verify_all.py`, or `--fast` to skip the slow support-mode runs.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python rado/verify_all.py

  # The submission linter carries its own fixture suite. It is what stands
  # between a paste and an OEIS editor, so it is graded on every push.
  oeis-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/oeis_lint.py --selftest

  # Pinned to the version ruff.toml was validated against. An unpinned lint
  # grades the code against whatever shipped that morning, which makes a red
  # run say nothing about the commit.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.1
      - run: ruff check .

  # The binary directly rather than gitleaks-action, and the whole history
  # rather than a diff. The action scans only the range <before>^..<after> that
  # a push touched, so a secret committed earlier and never edited again is
  # never looked at; and on a repository's first push the parent of the root
  # commit does not exist, so it fails outright. This repository's history was
  # rewritten once precisely because of an identifier in an old commit, which is
  # the case the diff-based scan is blind to.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
